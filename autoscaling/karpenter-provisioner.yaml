# Karpenter High-Performance Node Autoscaling for AWS EKS
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: mlops-compute-nodepool
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: category
          operator: In
          values: ["c", "m", "r", "g"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: mlops-node-class
  limits:
    cpu: 1000
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h # 30 days
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: mlops-node-class
spec:
  amiFamily: AL2
  role: "KarpenterNodeRole-mlops-clinical-trials"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mlops-clinical-trials"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mlops-clinical-trials"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: "alias/mlops-clinical-trials-dev"
---
# GPU Specific NodePool for ML Deep Learning Inference
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: mlops-gpu-nodepool
spec:
  template:
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g4dn.xlarge", "g4dn.2xlarge", "g5.xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: mlops-node-class
      taints:
        - key: "nvidia.com/gpu"
          value: "true"
          effect: "NoSchedule"
  limits:
    cpu: 200
    memory: 800Gi
