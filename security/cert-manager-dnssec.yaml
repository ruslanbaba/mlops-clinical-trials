# Cert-Manager and Automated TLS Certificate Management with DNS01 Challenge
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    pod-security.kubernetes.io/enforce: restricted

---
# ClusterIssuer using ACME Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@clinicaltrials-platform.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    # DNS01 Challenge via Route53 / Cloud DNS for secure wildcard certificates
    - dns01:
        route53:
          region: us-west-2
          hostedZoneID: Z0123456789ABCDEF
      selector:
        dnsZones:
          - "clinicaltrials.io"
          - "*.clinicaltrials.io"

---
# TLS Certificate for Model Serving Ingress / Gateway
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mlops-api-tls-cert
  namespace: mlops-clinical-trials
spec:
  secretName: mlops-api-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiry
  subject:
    organizations:
      - Clinical Trials MLOps Platform
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
  usages:
    - server auth
    - client auth
  dnsNames:
    - "api.clinicaltrials.io"
    - "serving.clinicaltrials.io"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
